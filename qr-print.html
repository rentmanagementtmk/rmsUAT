<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563EB">
  <title>RMS – Door Ledger QR Print Sheet</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ── Screen-only header ───────────────────────────────── */
    .qrp-screen-header {
      max-width: 960px;
      margin: 0 auto 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-radius: 12px;
      padding: 1rem 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .qrp-screen-header h1 { font-size: 1.25rem; font-weight: 700; }
    .qrp-screen-header p  { font-size: 0.875rem; color: #64748B; margin-top: 0.25rem; }

    .qrp-print-btn {
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.625rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .qrp-print-btn:hover { background: #1D4ED8; }

    /* ── Page wrapper ─────────────────────────────────────── */
    .qrp-page { max-width: 960px; margin: 0 auto; padding: 0 1.5rem 1.5rem; }

    /* ── Building section ─────────────────────────────────── */
    .qrp-building-section {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: 1.5rem;
    }

    .qrp-building-title {
      background: #1E293B;
      color: white;
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .qrp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0;
      background: #E2E8F0;
    }

    .qrp-card {
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.75rem 0.875rem;
      gap: 0.375rem;
      text-align: center;
    }

    .qrp-building { font-size: 0.75rem; font-weight: 700; color: #2563EB; text-transform: uppercase; letter-spacing: 0.05em; }
    .qrp-img-wrap { line-height: 0; }
    .qrp-img-wrap img { border-radius: 4px; }
    .qrp-floor { font-size: 0.9375rem; font-weight: 700; color: #1E293B; margin-top: 0.125rem; }
    .qrp-id {
      font-family: 'SF Mono', Consolas, 'Courier New', monospace;
      font-size: 0.6875rem;
      color: #64748B;
      background: #F1F5F9;
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }

    @media print {
      body { background: white; padding: 0.5cm; }
      .qrp-screen-header, .app-header, .bottom-nav { display: none; }
      .qrp-page { max-width: none; padding: 0; }
      .qrp-building-section { box-shadow: none; border: 1px solid #ccc; margin-bottom: 0.75rem; break-inside: avoid; }
      .qrp-building-title { background: #1E293B !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .qrp-grid { grid-template-columns: repeat(3, 1fr); }
      .qrp-card { border: 1px dashed #aaa; padding: 0.75rem 0.5rem; break-inside: avoid; }
      .qrp-img-wrap img { width: 5cm !important; height: 5cm !important; }
    }
  </style>
</head>
<body data-page="qr-print">

  <header class="app-header">
    <div class="header-brand">
      <span class="header-logo">🏠</span>
      <span class="header-title">RMS</span>
    </div>
  </header>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">💳</span>
      <span class="nav-label" data-i18n="nav.collect">Rent</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">📊</span>
      <span class="nav-label" data-i18n="nav.dashboard">Dashboard</span>
    </a>
    <a href="report.html" class="nav-item">
      <span class="nav-icon">📋</span>
      <span class="nav-label" data-i18n="nav.summary">Summary</span>
    </a>
    <button type="button" id="more-btn" class="nav-item">
      <span class="nav-icon">☰</span>
      <span class="nav-label" data-i18n="nav.more">More</span>
    </button>
  </nav>

  <div class="qrp-screen-header">
    <div>
      <h1>🏠 Door Ledger QR Print Sheet</h1>
      <p>24 houses · 5 buildings · Each QR opens that house's public rent ledger. Print and paste on the back of each house's main door.</p>
    </div>
    <button class="qrp-print-btn" onclick="window.print()">🖨&nbsp; Print All</button>
  </div>

  <div class="qrp-page" id="qrp-page"></div>

  <!-- More sheet -->
  <div id="more-sheet" class="more-overlay hidden" role="dialog" aria-modal="true">
    <div class="more-backdrop"></div>
    <div class="more-panel">
      <div class="more-panel-handle"></div>
      <p class="more-panel-title" data-i18n="nav.more">More</p>
      <p id="auth-info" class="more-auth-info"></p>
      <a href="ledger.html" class="more-item">
        <span class="more-item-icon">📒</span>
        <span class="more-item-label" data-i18n="nav.ledger">Tenant Ledger</span>
      </a>
      <a href="messenger.html" class="more-item">
        <span class="more-item-icon">💬</span>
        <span class="more-item-label" data-i18n="nav.messenger">Messenger</span>
      </a>
      <a href="misc-charges.html" class="more-item">
        <span class="more-item-icon">🧾</span>
        <span class="more-item-label" data-i18n="nav.misc_charges">Misc Charges</span>
      </a>
      <button id="logout-btn" type="button" class="more-item">
        <span class="more-item-icon">🚪</span>
        <span class="more-item-label" data-i18n="auth.logout">Logout</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="page-loader" class="page-loader hidden">
    <div class="spinner"></div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // BUILDINGS, HOUSES, FLOOR_LABELS are already declared globally by app.js — reused as-is here

    async function initQrPrintPage() {
      const page = document.getElementById('qrp-page');
      page.innerHTML = '<p style="padding:2rem;text-align:center;color:#64748B;">Loading house data…</p>';

      let tokenByHouse = {};
      try {
        const res = await apiGet({ action: 'getHouses' }); // authenticated — same deployment/config as the rest of the app
        if (!res.houses) throw new Error('No houses returned');
        res.houses.forEach(h => { tokenByHouse[h.HouseID] = h.PublicToken; });
      } catch (e) {
        page.innerHTML = '<p style="padding:2rem;text-align:center;color:#DC2626;">Failed to load house data. Refresh to retry.</p>';
        return;
      }

      page.innerHTML = '';
      let okCount = 0, failCount = 0;
      const total = HOUSES.length;

      BUILDINGS.forEach(building => {
        const houses = HOUSES.filter(h => h.building === building);

        const section = document.createElement('div');
        section.className = 'qrp-building-section';
        section.innerHTML = `
          <div class="qrp-building-title">${building} &nbsp;·&nbsp; ${houses.length} Houses</div>
          <div class="qrp-grid" id="qrp-grid-${building}"></div>
        `;
        page.appendChild(section);

        const grid = document.getElementById('qrp-grid-' + building);

        houses.forEach(h => {
          const card = document.createElement('div');
          card.className = 'qrp-card';
          card.innerHTML = `
            <div class="qrp-building">${h.building}</div>
            <div class="qrp-img-wrap" id="qrp-img-${h.id}"></div>
            <div class="qrp-floor">${h.building} ${h.displayNum}</div>
            <div class="qrp-id">${FLOOR_LABELS[h.floor] || h.floor}</div>
          `;
          grid.appendChild(card);

          try {
            const publicToken = tokenByHouse[h.id];
            // Relative to THIS page's own deployed URL — automatically correct on Prod and UAT alike,
            // no manually-set config value needed (unlike the earlier offline-tool version)
            const doorLedgerUrl = publicToken
              ? new URL('door-ledger.html?t=' + encodeURIComponent(publicToken), location.href).href
              : h.id; // fallback — shouldn't happen once getHouses has self-healed all tokens

            const wrap = document.getElementById('qrp-img-' + h.id);

            if (typeof QRCode !== 'undefined') {
              // Primary path: client-side canvas library — no third-party network dependency once loaded
              new QRCode(wrap, {
                text: doorLedgerUrl, width: 200, height: 200,
                colorDark: '#1E293B', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M,
              });
              okCount++;
            } else {
              // Fallback path: image-generation API, only used if the canvas library failed to load
              const qrImg = document.createElement('img');
              qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(doorLedgerUrl);
              qrImg.width = 200;
              qrImg.height = 200;
              qrImg.alt = h.id;
              qrImg.onerror = () => {
                failCount++;
                wrap.innerHTML = '<p style="color:#DC2626;font-size:0.7rem;">QR failed to load</p>';
                updateStatusBanner();
              };
              qrImg.onload = () => { okCount++; updateStatusBanner(); };
              wrap.appendChild(qrImg);
            }
          } catch (err) {
            failCount++;
            document.getElementById('qrp-img-' + h.id).innerHTML = '<p style="color:#DC2626;font-size:0.7rem;">' + err.message + '</p>';
          }
        });
      });

      updateStatusBanner();

      function updateStatusBanner() {
        let banner = document.getElementById('qrp-status-banner');
        if (!banner) {
          banner = document.createElement('p');
          banner.id = 'qrp-status-banner';
          banner.style.cssText = 'max-width:960px;margin:0 auto 1rem;padding:0.625rem 1rem;border-radius:8px;font-size:0.8125rem;';
          page.parentNode.insertBefore(banner, page);
        }
        if (failCount === 0) {
          banner.style.cssText += 'background:#DCFCE7;color:#166534;';
          banner.textContent = `✅ All ${total} QR codes rendered successfully.`;
        } else {
          banner.style.cssText += 'background:#FEE2E2;color:#991B1B;';
          banner.textContent = `⚠️ ${failCount} of ${total} QR codes failed to render — check your internet connection and refresh.`;
        }
      }
    }
  </script>
</body>
</html>
