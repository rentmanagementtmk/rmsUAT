<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RMS – Tenant Ledger</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="ledger">

  <header class="app-header">
    <div class="header-brand">
      <a href="javascript:history.back()" id="ledger-back-btn" class="ledger-back-btn" aria-label="Back">&#8592;</a>
      <span class="header-title" data-i18n="ledger.title">Tenant Ledger</span>
    </div>
    <div class="header-actions">
      <button id="lang-toggle" class="lang-btn" aria-label="Switch language">
        <span class="lang-seg lang-en">E</span>
        <span class="lang-seg lang-kn">ಕ</span>
      </button>
    </div>
  </header>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">💳</span>
      <span class="nav-label" data-i18n="nav.collect">Rent</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">📊</span>
      <span class="nav-label" data-i18n="nav.dashboard">Dashboard</span>
    </a>
    <a href="report.html" class="nav-item">
      <span class="nav-icon">📋</span>
      <span class="nav-label" data-i18n="nav.summary">Summary</span>
    </a>
    <button type="button" id="more-btn" class="nav-item">
      <span class="nav-icon">☰</span>
      <span class="nav-label" data-i18n="nav.more">More</span>
    </button>
  </nav>

  <main>

    <!-- ── HOUSE SELECTOR (shown when no ?house= param) ──────── -->
    <section id="ledger-selector" class="card hidden">
      <div class="field">
        <label for="ledger-house-select" data-i18n="ledger.select_house">Select House</label>
        <select id="ledger-house-select">
          <option value="" data-i18n="collect.house_ph">— select a house —</option>
        </select>
      </div>
      <button id="ledger-view-btn" class="btn btn-primary" data-i18n="ledger.view_btn">View Ledger</button>
    </section>

    <!-- ── LOADING / CONTENT ──────────────────────────────────── -->
    <div id="ledger-loading" class="loading-state hidden">
      <div class="spinner"></div>
      <span data-i18n="dashboard.loading">Loading…</span>
    </div>

    <div id="ledger-content"></div>

  </main>

  <!-- More sheet -->
  <div id="more-sheet" class="more-overlay hidden" role="dialog" aria-modal="true">
    <div class="more-backdrop"></div>
    <div class="more-panel">
      <div class="more-panel-handle"></div>
      <p class="more-panel-title" data-i18n="nav.more">More</p>
      <p id="auth-info" class="more-auth-info"></p>
      <a href="ledger.html" class="more-item">
        <span class="more-item-icon">📒</span>
        <span class="more-item-label" data-i18n="nav.ledger">Tenant Ledger</span>
      </a>
      <a href="messenger.html" class="more-item">
        <span class="more-item-icon">💬</span>
        <span class="more-item-label" data-i18n="nav.messenger">Messenger</span>
      </a>
      <a href="misc-charges.html" class="more-item">
        <span class="more-item-icon">🧾</span>
        <span class="more-item-label" data-i18n="nav.misc_charges">Misc Charges</span>
      </a>
      <a href="qr-print.html" class="more-item">
        <span class="more-item-icon">🖶️</span>
        <span class="more-item-label" data-i18n="nav.qr_print">Print QR Codes</span>
      </a>
      <button id="logout-btn" type="button" class="more-item">
        <span class="more-item-icon">🚪</span>
        <span class="more-item-label" data-i18n="auth.logout">Logout</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="page-loader" class="page-loader hidden">
    <div class="spinner"></div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
