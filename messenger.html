<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RMS – Messenger</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="messenger">

  <header class="app-header">
    <div class="header-brand">
      <span class="header-logo">🏠</span>
      <span class="header-title" data-i18n="messenger.title">Messenger</span>
    </div>
    <div class="header-actions">
      <button id="lang-toggle" class="lang-btn" aria-label="Switch language">
        <span class="lang-seg lang-en">E</span>
        <span class="lang-seg lang-kn">ಕ</span>
      </button>
    </div>
  </header>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">💳</span>
      <span class="nav-label" data-i18n="nav.collect">Rent</span>
    </a>
    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">📊</span>
      <span class="nav-label" data-i18n="nav.dashboard">Dashboard</span>
    </a>
    <a href="report.html" class="nav-item">
      <span class="nav-icon">📋</span>
      <span class="nav-label" data-i18n="nav.summary">Summary</span>
    </a>
    <button type="button" id="more-btn" class="nav-item">
      <span class="nav-icon">☰</span>
      <span class="nav-label" data-i18n="nav.more">More</span>
    </button>
  </nav>

  <main>
    <section class="card">
      <div class="field">
        <label for="msg-house-select" data-i18n="messenger.select_house">Select House</label>
        <select id="msg-house-select">
          <option value="" data-i18n="collect.house_ph">— select a house —</option>
        </select>
      </div>

      <div id="msg-phones" class="msg-phones-wrap">
        <label data-i18n="messenger.recipients">Recipients</label>
        <label class="msg-phone-row">
          <input type="checkbox" id="msg-phone1-cb">
          <span class="msg-phone-static" data-i18n="messenger.phone1_label">Phone 1:</span>
          <span id="msg-phone1-label">—</span>
        </label>
        <label class="msg-phone-row">
          <input type="checkbox" id="msg-phone2-cb">
          <span class="msg-phone-static" data-i18n="messenger.phone2_label">Phone 2:</span>
          <span id="msg-phone2-label">—</span>
        </label>
      </div>

      <div class="field">
        <label for="msg-text" data-i18n="messenger.message_label">Message</label>
        <textarea id="msg-text" rows="4" data-i18n-placeholder="messenger.message_ph" placeholder="Type your message…"></textarea>
      </div>

      <div class="btn-group">
        <button id="msg-clear-btn" type="button" class="btn btn-secondary" data-i18n="messenger.clear_btn">Clear</button>
        <button id="msg-send-btn" class="btn btn-primary" data-i18n="messenger.send_btn">Send</button>
      </div>
    </section>

    <section class="card">
      <h3 class="section-title" data-i18n="messenger.log_title">Message Log</h3>
      <div id="msg-log-list"></div>
      <button id="msg-show-more" class="btn btn-secondary hidden" data-i18n="messenger.show_more">Show More</button>
    </section>
  </main>

  <!-- More sheet -->
  <div id="more-sheet" class="more-overlay hidden" role="dialog" aria-modal="true">
    <div class="more-backdrop"></div>
    <div class="more-panel">
      <div class="more-panel-handle"></div>
      <p class="more-panel-title" data-i18n="nav.more">More</p>
      <p id="auth-info" class="more-auth-info"></p>
      <a href="ledger.html" class="more-item">
        <span class="more-item-icon">📒</span>
        <span class="more-item-label" data-i18n="nav.ledger">Tenant Ledger</span>
      </a>
      <a href="messenger.html" class="more-item">
        <span class="more-item-icon">💬</span>
        <span class="more-item-label" data-i18n="nav.messenger">Messenger</span>
      </a>
      <a href="misc-charges.html" class="more-item">
        <span class="more-item-icon">🧾</span>
        <span class="more-item-label" data-i18n="nav.misc_charges">Misc Charges</span>
      </a>
      <button id="logout-btn" type="button" class="more-item">
        <span class="more-item-icon">🚪</span>
        <span class="more-item-label" data-i18n="auth.logout">Logout</span>
      </button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Full-page spinner shown during house lookup API calls -->
  <div id="page-loader" class="page-loader hidden">
    <div class="spinner"></div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
